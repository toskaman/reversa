# REVERSA production stack: 1 VM, TLS auto, persistent state.
# Usage: DOMAIN=<ip>.nip.io POSTGRES_PASSWORD=<secret> docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reversa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reversa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reversa"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ../apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://reversa:${POSTGRES_PASSWORD}@postgres:5432/reversa
      REVERSA_DATA_DIR: /data
      REVERSA_WORKER_ID: worker-1
      VULTR_INFERENCE_API_KEY: ${VULTR_INFERENCE_API_KEY:-}
      VULTR_INFERENCE_MODEL: ${VULTR_INFERENCE_MODEL:-}
      REVERSA_CORS: https://${DOMAIN}
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 10s
      retries: 5

  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
      - caddyconfig:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - api
      - web

volumes:
  pgdata:
  appdata:
  caddydata:
  caddyconfig:
